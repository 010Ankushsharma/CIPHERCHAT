####################################################################
# CipherChat Server — Version Catalog
####################################################################

[versions]
kotlin                  = "2.1.0"
ktor-server             = "3.0.1"
exposed                 = "0.55.0"
postgresql              = "42.7.4"
hikari                  = "5.1.0"         # connection pooling
lettuce                 = "6.4.0.RELEASE" # Redis client (async, Netty-backed)
kafka                   = "3.8.0"
kotlinx-serialization   = "1.7.3"
kotlinx-coroutines      = "1.9.0"
logback                 = "1.5.11"
koin-ktor               = "4.0.0"
bcrypt                  = "0.10.2"
jjwt                    = "0.12.6"        # JWT (access tokens)
micrometer              = "1.13.6"        # metrics -> Prometheus

[libraries]
# --- Ktor server ---
ktor-server-core        = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor-server" }
ktor-server-netty       = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor-server" }
ktor-server-websockets  = { module = "io.ktor:ktor-server-websockets-jvm", version.ref = "ktor-server" }
ktor-server-auth        = { module = "io.ktor:ktor-server-auth-jvm", version.ref = "ktor-server" }
ktor-server-auth-jwt    = { module = "io.ktor:ktor-server-auth-jwt-jvm", version.ref = "ktor-server" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor-server" }
ktor-server-rate-limit  = { module = "io.ktor:ktor-server-rate-limiting-jvm", version.ref = "ktor-server" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor-server" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor-server" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor-server" }

# --- Database (Exposed + PostgreSQL) ---
exposed-core            = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao             = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc            = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
postgresql-driver       = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari                  = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

# --- Redis ---
lettuce-core            = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

# --- Kafka ---
kafka-clients           = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }

# --- Serialization / Coroutines ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# --- Auth ---
bcrypt                  = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
jjwt-api               = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl              = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson           = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# --- Observability ---
micrometer-core         = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-prometheus   = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer-jvm", version.ref = "ktor-server" }

# --- Logging ---
logback-classic         = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# --- DI ---
koin-ktor               = { module = "io.insert-koin:koin-ktor", version.ref = "koin-ktor" }
koin-logger-slf4j       = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin-ktor" }

# --- Test ---
ktor-server-test-host   = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor-server" }
kotlin-test-junit5      = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

[plugins]
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
