####################################################################
# CipherChat — Version Catalog
# ------------------------------------------------------------------
# Single source of truth for dependency + plugin versions across
# every client module. Update a library here once, it updates
# everywhere it's used.
####################################################################

[versions]
kotlin                 = "2.1.0"
agp                     = "8.6.1"
compose-multiplatform   = "1.7.0"
compose-material3       = "1.3.1"
coroutines              = "1.9.0"
koin                    = "4.0.0"
voyager                 = "1.1.0-beta03"
sqldelight              = "2.0.2"
coil                    = "2.7.0"
ktor                    = "3.0.1"
kotlinx-serialization   = "1.7.3"
kotlinx-datetime        = "0.6.1"
lottie-compose          = "2.0.0"
haze                    = "0.7.3"
napier                  = "2.7.1"      # cross-platform logging
libsodium-bindings      = "0.9.2"      # KMP libsodium wrapper for crypto core

[libraries]
# --- Compose / UI ---
compose-runtime         = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation      = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3       = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-animation       = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose-multiplatform" }
lottie-compose          = { module = "io.github.alexzhirkevich:compottie", version.ref = "lottie-compose" }
haze                    = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
coil-compose            = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# --- Navigation ---
voyager-navigator       = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-screenmodel     = { module = "cafe.adriel.voyager:voyager-screenmodel", version.ref = "voyager" }
voyager-transitions     = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyager" }
voyager-koin            = { module = "cafe.adriel.voyager:voyager-koin", version.ref = "voyager" }

# --- DI ---
koin-core               = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose            = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# --- Coroutines / Serialization / Time ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime        = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# --- Networking (Ktor CLIENT — used by app, distinct from server) ---
ktor-client-core        = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets  = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-auth        = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }

# --- Local persistence ---
sqldelight-runtime      = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines   = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# --- Crypto ---
libsodium-bindings      = { module = "com.ionspin.kotlin:multiplatform-crypto-libsodium-bindings", version.ref = "libsodium-bindings" }

# --- Logging ---
napier                  = { module = "io.github.aakira:napier", version.ref = "napier" }

[plugins]
kotlinMultiplatform     = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication      = { id = "com.android.application", version.ref = "agp" }
androidLibrary          = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform    = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight              = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
