name: CipherChat CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new push arrives —
# no point continuing a PR build if the developer just pushed another
# commit on top of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gateway

jobs:

  # -----------------------------------------------------------------------
  # Job 1: Server (Ktor) — build, test, lint
  # -----------------------------------------------------------------------
  server-build:
    name: Server Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipherchat
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: cipherchat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build server
        run: ./gradlew build --no-daemon

      - name: Run tests
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/cipherchat_test
          DATABASE_USER: cipherchat
          DATABASE_PASSWORD: ci_password
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_at_least_32_chars_long
          JWT_ISSUER: cipherchat-ci
          JWT_AUDIENCE: cipherchat-ci-clients
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/**/build/reports/tests/

  # -----------------------------------------------------------------------
  # Job 2: Client (KMP) — build shared + domain + crypto modules,
  #         run common tests. Full Android/iOS build skipped on PRs
  #         (too slow) but runs on main merges.
  # -----------------------------------------------------------------------
  client-build:
    name: Client Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build core modules
        run: >
          ./gradlew
          :core:domain:build
          :core:crypto:jvmTest
          :core:network:build
          :core:database:build
          :core:designsystem:build
          --no-daemon

      - name: Run common tests
        run: ./gradlew allTests --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results
          path: client/**/build/reports/tests/

  # -----------------------------------------------------------------------
  # Job 3: Android APK — only on main branch merges (slow, ~10 min).
  #         Produces a signed debug APK as a build artifact.
  # -----------------------------------------------------------------------
  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [client-build]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cipherchat-debug-apk
          path: client/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  # -----------------------------------------------------------------------
  # Job 4: Docker image — build and push to GHCR on main branch.
  #         Uses SHA digest so production deployments are reproducible.
  # -----------------------------------------------------------------------
  docker-build:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [server-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: docker-push
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/docker/Dockerfile.gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build cache — reuses layers from previous builds so only
          # changed layers are rebuilt. Cuts average build time from
          # ~8 min to ~2 min after the first build.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Image digest ${{ steps.docker-push.outputs.digest }}"

  # -----------------------------------------------------------------------
  # Job 5: Deploy to staging — runs after docker-build on main branch.
  #         Updates the staging Kustomize overlay with the new image tag
  #         and applies to the staging Kubernetes cluster.
  # -----------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl for staging cluster
        run: |
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy to staging
        run: |
          kustomize build server/k8s/overlays/staging | kubectl apply -f -
          kubectl rollout status deployment/cipherchat-gateway -n cipherchat-staging --timeout=120s

      - name: Verify staging health
        run: |
          kubectl get pods -n cipherchat-staging -l app=cipherchat-gateway
          echo "Staging deploy complete ✓"
