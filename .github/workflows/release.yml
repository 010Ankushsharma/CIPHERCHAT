name: CipherChat Release

on:
  push:
    tags:
      - "v*.*.*"   # triggers on v0.1.0, v1.0.0, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gateway

jobs:

  # -----------------------------------------------------------------------
  # Job 1: Production Docker image — pinned to the release tag SHA.
  # -----------------------------------------------------------------------
  docker-release:
    name: Docker Release Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.docker-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push release image
        id: docker-push
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/docker/Dockerfile.gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------
  # Job 2: Android release APK — signed with release keystore.
  # -----------------------------------------------------------------------
  android-release:
    name: Android Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > client/androidApp/release.jks

      - name: Build release APK
        working-directory: client
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: cipherchat-release-${{ github.ref_name }}-apk
          path: client/androidApp/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: client/androidApp/build/outputs/apk/release/*.apk
          generate_release_notes: true

  # -----------------------------------------------------------------------
  # Job 3: Deploy to production — requires manual approval via GitHub
  #         Environments. A team member must approve in the GitHub UI
  #         before kubectl apply runs. This gate prevents accidental
  #         production deploys and provides an audit trail of who
  #         approved each release.
  # -----------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-release, android-release]
    environment: production   # requires manual approval in GitHub UI
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin production image SHA in Kustomize overlay
        run: |
          IMAGE_DIGEST="${{ needs.docker-release.outputs.image-digest }}"
          sed -i "s|digest: sha256:REPLACE_WITH_ACTUAL_SHA256_DIGEST_FROM_CI_PIPELINE|digest: ${IMAGE_DIGEST}|g" \
            server/k8s/overlays/production/kustomization.yaml
          echo "Pinned production image to digest: ${IMAGE_DIGEST}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl for production cluster
        run: |
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Apply production manifests
        run: |
          kustomize build server/k8s/overlays/production | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cipherchat-gateway \
            -n cipherchat-production \
            --timeout=300s

      - name: Smoke test production
        run: |
          GATEWAY_URL="${{ secrets.PRODUCTION_GATEWAY_URL }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${GATEWAY_URL}/metrics")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Smoke test FAILED — /metrics returned HTTP $HTTP_STATUS"
            kubectl rollout undo deployment/cipherchat-gateway -n cipherchat-production
            exit 1
          fi
          echo "Smoke test passed — HTTP $HTTP_STATUS ✓"

      - name: Tag release commit
        run: |
          echo "Production deploy of ${{ github.ref_name }} complete ✓"
